name: MCP integration help
description: Ask for help wiring the server into a specific MCP client or workflow.
title: "[Integration]: "
labels:
  - question
  - mcp
body:
  - type: input
    id: package_version
    attributes:
      label: Package version
      placeholder: 0.1.8
    validations:
      required: true
  - type: input
    id: mcp_host
    attributes:
      label: MCP host
      placeholder: Claude Desktop, Cursor, Windsurf, MCP Inspector
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS 15, Ubuntu 24.04, Windows 11
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Current MCP config
      description: Remove secrets before pasting.
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is failing?
    validations:
      required: true
